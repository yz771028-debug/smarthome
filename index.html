<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIOT 智慧安防監控面板</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      color: #333;
      margin-bottom: 5px;
    }

    .connect-status {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      background: #ddd;
      color: #333;
      font-size: 0.9rem;
      margin-top: 8px;
    }

    .connected {
      background: #2ed573;
      color: white;
    }

    .disconnected {
      background: #ff4757;
      color: white;
    }

    .mode-banner {
      font-size: 1.3rem;
      font-weight: bold;
      padding: 10px;
      margin: 15px 0;
      border-radius: 8px;
      background: #eee;
      display: inline-block;
      min-width: 250px;
      transition: all 0.3s ease;
    }

    .mode-auto {
      background: #e2f0d9;
      color: #385723;
      border: 2px solid #385723;
    }

    .mode-manual {
      background: #ddebf7;
      color: #1f4e78;
      border: 2px solid #1f4e78;
    }

    .mode-security {
      background: #fce4d6;
      color: #c00000;
      border: 2px solid #c00000;
      animation: blink 1.5s infinite alternate;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .card {
      background: #fafafa;
      padding: 20px;
      border-radius: 8px;
      border-left: 5px solid #ccc;
      text-align: left;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .card.temp {
      border-left-color: #ffc000;
    }

    .card.hum {
      border-left-color: #00b0f0;
    }

    .card.gas {
      border-left-color: #7030a0;
    }

    .value {
      font-size: 1.8rem;
      font-weight: bold;
      color: #333;
      margin-top: 5px;
    }

    .control-section {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px solid #eee;
      text-align: left;
    }

    .btn {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 10px;
      margin-bottom: 10px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-green {
      background: #2ed573;
      color: white;
    }

    .btn-blue {
      background: #1e90ff;
      color: white;
    }

    .btn-red {
      background: #ff4757;
      color: white;
    }

    .log {
      margin-top: 20px;
      background: #111827;
      color: #d1d5db;
      padding: 12px;
      border-radius: 8px;
      text-align: left;
      height: 100px;
      overflow-y: auto;
      font-size: 0.9rem;
    }

    @keyframes blink {
      from {
        box-shadow: 0 0 5px #ff4757;
      }

      to {
        box-shadow: 0 0 15px #ff4757;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <h1>AIOT 多功能居家智慧安防系統</h1>

  <div id="mqtt-status" class="connect-status disconnected">
    MQTT：連線中...
  </div>

  <br>

  <div id="mode-status" class="mode-banner mode-auto">
    系統運作模式：<span id="txt-mode">連線中...</span>
  </div>

  <div class="grid">
    <div class="card temp">
      <div>🌡️ 房間 1 溫度</div>
      <div id="v-t1" class="value">--.- °C</div>
    </div>

    <div class="card hum">
      <div>💧 房間 1 濕度</div>
      <div id="v-h1" class="value">--.- %</div>
    </div>

    <div class="card gas">
      <div>⚠️ 房間 1 瓦斯</div>
      <div id="v-g1" class="value">---- ppm</div>
    </div>

    <div class="card temp">
      <div>🌡️ 房間 2 溫度</div>
      <div id="v-t2" class="value">--.- °C</div>
    </div>

    <div class="card hum">
      <div>💧 房間 2 濕度</div>
      <div id="v-h2" class="value">--.- %</div>
    </div>

    <div class="card gas">
      <div>⚠️ 房間 2 瓦斯</div>
      <div id="v-g2" class="value">---- ppm</div>
    </div>
  </div>

  <div class="control-section">
    <h3>系統情境切換指令</h3>
    <button class="btn btn-green" onclick="sendMQTT('smarthome/mode/cmd', 'AUTO')">
      ☀️ 切換為【自動模式】
    </button>

    <button class="btn btn-blue" onclick="sendMQTT('smarthome/mode/cmd', 'MANUAL')">
      🎛️ 切換為【手動模式】
    </button>

    <button class="btn btn-red" onclick="sendMQTT('smarthome/mode/cmd', 'SECURITY')">
      👮 開啟【深夜防盜保全】
    </button>
  </div>

  <div class="control-section">
    <h3>全手動家電控制 (僅在手動模式有效)</h3>

    <button class="btn btn-blue" onclick="sendMQTT('smarthome/relay/cmd', 'ON')">
      開啟排風扇
    </button>

    <button class="btn btn-red" onclick="sendMQTT('smarthome/relay/cmd', 'OFF')">
      關閉排風扇
    </button>
  </div>

  <div class="control-section">
    <h3>實體風扇紅外線遙控 (YS-IRTM 轉發)</h3>

    <button class="btn btn-green" onclick="sendMQTT('smarthome/ir/cmd', 'UP')">
      📺 風扇速 ＋
    </button>

    <button class="btn btn-blue" onclick="sendMQTT('smarthome/ir/cmd', 'DOWN')">
      📺 風扇速 －
    </button>

    <button class="btn btn-red" onclick="sendMQTT('smarthome/ir/cmd', 'SWING')">
      🔄 風扇擺頭
    </button>
  </div>

  <div class="log" id="log">
    系統訊息...
  </div>
</div>

<script>
  // ===== EMQX WebSocket MQTT =====
  const MQTT_HOST = "broker.emqx.io";

  // 如果網頁放 GitHub Pages / HTTPS，建議用 8084 + SSL
  const MQTT_PORT = 8084;

  const CLIENT_ID =
    "WebClient_" +
    Math.random().toString(16).substr(2, 8);

  const client =
    new Paho.MQTT.Client(
      MQTT_HOST,
      MQTT_PORT,
      CLIENT_ID
    );

  const TOPIC_STATUS_REPORT =
    "smarthome/status/report";

  function log(msg) {
    const logBox = document.getElementById("log");
    const time = new Date().toLocaleTimeString();

    logBox.innerHTML =
      `[${time}] ${msg}<br>` +
      logBox.innerHTML;
  }

  function setMqttStatus(isConnected, text) {
    const status =
      document.getElementById("mqtt-status");

    status.innerText = text;

    if (isConnected) {
      status.classList.remove("disconnected");
      status.classList.add("connected");
    } else {
      status.classList.remove("connected");
      status.classList.add("disconnected");
    }
  }

  client.onConnectionLost = function(responseObject) {
    setMqttStatus(false, "MQTT：連線中斷，重新連線中...");

    if (responseObject.errorMessage) {
      log("MQTT 連線中斷：" + responseObject.errorMessage);
    }

    setTimeout(connectMQTT, 5000);
  };

  client.onMessageArrived = function(message) {
    try {
      let data =
        JSON.parse(message.payloadString);

      // 防止 ESP 傳字串時 toFixed 出錯
      const t1 = Number(data.t1 || 0);
      const h1 = Number(data.h1 || 0);
      const g1 = Number(data.g1 || 0);

      const t2 = Number(data.t2 || 0);
      const h2 = Number(data.h2 || 0);
      const g2 = Number(data.g2 || 0);

      document.getElementById("v-t1").innerText =
        t1.toFixed(1) + " °C";

      document.getElementById("v-h1").innerText =
        h1.toFixed(1) + " %";

      document.getElementById("v-g1").innerText =
        g1 + " ppm";

      document.getElementById("v-t2").innerText =
        t2.toFixed(1) + " °C";

      document.getElementById("v-h2").innerText =
        h2.toFixed(1) + " %";

      document.getElementById("v-g2").innerText =
        g2 + " ppm";

      let modeBanner =
        document.getElementById("mode-status");

      let modeText =
        document.getElementById("txt-mode");

      modeBanner.className = "mode-banner";

      if (data.mode === "AUTO") {
        modeBanner.classList.add("mode-auto");
        modeText.innerText = "☀️ 自動溫控追蹤中";
      }
      else if (data.mode === "MANUAL") {
        modeBanner.classList.add("mode-manual");
        modeText.innerText = "🎛️ 手動控制開放中";
      }
      else if (data.mode === "SECURITY") {
        modeBanner.classList.add("mode-security");
        modeText.innerText = "👮 深夜防盜保全高警報中";
      }
      else {
        modeText.innerText = "未知模式";
      }

    } catch (e) {
      console.log("解析 JSON 錯誤: " + e);
      log("解析 JSON 錯誤，請確認 ESP 回傳格式");
    }
  };

  function connectMQTT() {
    setMqttStatus(false, "MQTT：連線中...");

    client.connect({
      onSuccess: function() {
        setMqttStatus(true, "MQTT：已連線 EMQX");
        log("網頁已成功連線 EMQX MQTT 伺服器");

        client.subscribe(TOPIC_STATUS_REPORT);
        log("已訂閱：" + TOPIC_STATUS_REPORT);
      },

      onFailure: function(error) {
        setMqttStatus(false, "MQTT：連線失敗，5秒後重試");
        log("MQTT 連線失敗：" + error.errorMessage);

        setTimeout(connectMQTT, 5000);
      },

      useSSL: true,
      timeout: 8,
      keepAliveInterval: 30,
      cleanSession: true
    });
  }

  function sendMQTT(topic, payload) {
    if (!client.isConnected()) {
      alert("MQTT 尚未連線，請稍後再試");
      return;
    }

    let message =
      new Paho.MQTT.Message(payload);

    message.destinationName = topic;
    message.qos = 1;
    message.retained = false;

    client.send(message);

    log("已發射控制指令 → " + topic + " : " + payload);
  }

  connectMQTT();
</script>

</body>
</html>
