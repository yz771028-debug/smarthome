<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智慧居家控制</title>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #0f4c81, transparent 35%),
        linear-gradient(135deg, #020617, #0f172a 60%, #020617);
      color: #e5f3ff;
    }

    header {
      padding: 24px;
      text-align: center;
      background: rgba(15, 23, 42, 0.75);
      border-bottom: 1px solid rgba(148, 163, 184, 0.25);
      backdrop-filter: blur(12px);
    }

    header h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: 2px;
      color: #38bdf8;
    }

    header p {
      margin: 8px 0 0;
      color: #cbd5e1;
    }

    .container {
      width: min(1200px, 94%);
      margin: 24px auto;
      display: grid;
      gap: 20px;
    }

    .top-status {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .card {
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(14px);
    }

    .card h2 {
      margin-top: 0;
      color: #7dd3fc;
      font-size: 22px;
      border-bottom: 1px solid rgba(125, 211, 252, 0.25);
      padding-bottom: 10px;
    }

    .room-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 20px;
    }

    .value {
      font-size: 30px;
      font-weight: bold;
      color: #f8fafc;
    }

    .label {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .sensor-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .sensor-box {
      background: rgba(30, 41, 59, 0.75);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .status-line {
      margin: 8px 0;
      color: #dbeafe;
      font-size: 16px;
    }

    .status-line span {
      color: #38bdf8;
      font-weight: bold;
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px 16px;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.15);
    }

    .btn-green {
      background: linear-gradient(135deg, #16a34a, #15803d);
    }

    .btn-red {
      background: linear-gradient(135deg, #dc2626, #991b1b);
    }

    .btn-purple {
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
    }

    .btn-orange {
      background: linear-gradient(135deg, #f97316, #c2410c);
    }

    .btn-gray {
      background: linear-gradient(135deg, #475569, #334155);
    }

    .setting-row {
      display: grid;
      grid-template-columns: 140px 1fr 120px;
      gap: 10px;
      align-items: center;
      margin: 12px 0;
    }

    .setting-row label {
      color: #e0f2fe;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(125, 211, 252, 0.3);
      background: rgba(15, 23, 42, 0.85);
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #38bdf8;
    }

    .mqtt-status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: #7f1d1d;
      color: white;
      font-weight: bold;
    }

    .mqtt-online {
      background: #166534;
    }

    .alarm {
      color: #f87171;
      font-weight: bold;
    }

    .safe {
      color: #4ade80;
      font-weight: bold;
    }

    @media (max-width: 650px) {
      .sensor-row {
        grid-template-columns: 1fr;
      }

      .setting-row {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>智慧居家控制</h1>
    <p>環境監測・排風扇控制・AI 人臉追蹤・自動模式門檻設定</p>
    <p>MQTT 狀態：<span id="mqttStatus" class="mqtt-status">離線</span></p>
  </header>

  <main class="container">

    <section class="top-status">
      <div class="card">
        <h2>系統狀態</h2>
        <p class="status-line">目前模式：<span id="modeText">--</span></p>
        <p class="status-line">排風扇 Relay：<span id="relayText">--</span></p>
        <p class="status-line">HuskyLens：<span id="huskyText">--</span></p>
        <p class="status-line">步進角度：<span id="angleText">--</span> 度</p>
        <p class="status-line">手勢：<span id="gestureText">--</span></p>
      </div>

      <div class="card">
        <h2>安全警報</h2>
        <p class="status-line">瓦斯警報：<span id="gasAlarmText" class="safe">正常</span></p>
        <p class="status-line">防盜警報：<span id="intrudeText" class="safe">正常</span></p>
        <p class="status-line">人臉解鎖：<span id="unlockText">--</span></p>
      </div>
    </section>

    <section class="room-grid">
      <div class="card">
        <h2>房間 1</h2>
        <div class="sensor-row">
          <div class="sensor-box">
            <div class="label">溫度</div>
            <div class="value"><span id="t1">--</span>°C</div>
          </div>
          <div class="sensor-box">
            <div class="label">濕度</div>
            <div class="value"><span id="h1">--</span>%</div>
          </div>
          <div class="sensor-box">
            <div class="label">瓦斯</div>
            <div class="value"><span id="g1">--</span></div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>房間 2</h2>
        <div class="sensor-row">
          <div class="sensor-box">
            <div class="label">溫度</div>
            <div class="value"><span id="t2">--</span>°C</div>
          </div>
          <div class="sensor-box">
            <div class="label">濕度</div>
            <div class="value"><span id="h2">--</span>%</div>
          </div>
          <div class="sensor-box">
            <div class="label">瓦斯</div>
            <div class="value"><span id="g2">--</span></div>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>模式控制</h2>
      <div class="control-grid">
        <button onclick="setMode('AUTO')" class="btn-green">自動模式</button>
        <button onclick="setMode('MANUAL')" class="btn-orange">手動模式</button>
        <button onclick="setMode('SECURITY')" class="btn-red">保全模式</button>
      </div>
    </section>

    <section class="card">
      <h2>自動模式門檻設定</h2>

      <div class="setting-row">
        <label>溫度門檻 °C</label>
        <input id="tempThresholdInput" type="number" value="30" min="10" max="60" step="0.1">
        <button onclick="setTempThreshold()">設定溫度</button>
      </div>

      <div class="setting-row">
        <label>濕度門檻 %</label>
        <input id="humThresholdInput" type="number" value="80" min="30" max="100" step="1">
        <button onclick="setHumThreshold()">設定濕度</button>
      </div>

      <div class="setting-row">
        <label>瓦斯門檻</label>
        <input id="gasThresholdInput" type="number" value="1000" min="100" max="5000" step="10">
        <button onclick="setGasThreshold()">設定瓦斯</button>
      </div>

      <p id="thresholdStatus" class="status-line">
        目前門檻：溫度 -- °C｜濕度 -- %｜瓦斯 --
      </p>
    </section>

    <section class="card">
      <h2>排風扇 Relay 控制</h2>
      <div class="control-grid">
        <button class="btn-green" onclick="relayControl('ON')">開啟排風扇</button>
        <button class="btn-red" onclick="relayControl('OFF')">關閉排風扇</button>
      </div>
    </section>

    <section class="card">
      <h2>紅外線風扇控制</h2>
      <div class="control-grid">
        <button onclick="irControl('OPEN')" class="btn-green">開風扇 + 風量+</button>
        <button onclick="irControl('CLOSE')" class="btn-red">關閉風扇</button>
        <button onclick="irControl('UP')">風量 +</button>
        <button onclick="irControl('DOWN')">風量 -</button>
        <button onclick="irControl('SWING')" class="btn-purple">擺頭</button>
      </div>
    </section>

    <section class="card">
      <h2>AI / HuskyLens 控制</h2>
      <div class="control-grid">
        <button onclick="huskyMode('FACE')" class="btn-purple">人臉辨識</button>
        <button onclick="huskyMode('HAND')" class="btn-purple">手勢辨識</button>
      </div>
    </section>

    <section class="card">
      <h2>步進馬達控制</h2>
      <div class="control-grid">
        <button onclick="stepperControl('LEFT')" class="btn-gray">左轉</button>
        <button onclick="stepperControl('CENTER')" class="btn-purple">回中心</button>
        <button onclick="stepperControl('RIGHT')" class="btn-gray">右轉</button>
        <button onclick="stepperControl('SETCENTER')" class="btn-orange">校正目前為中心</button>
      </div>
    </section>

  </main>

  <script>
    // =====================================================
    // MQTT 設定
    // =====================================================
    const MQTT_BROKER = "wss://broker.emqx.io:8084/mqtt";
    const CLIENT_ID = "web_smart_home_" + Math.random().toString(16).substring(2, 10);

    const TOPIC_STATUS = "smarthome/status/report";

    const TOPIC_MODE_CMD = "smarthome/mode/cmd";
    const TOPIC_RELAY_CMD = "smarthome/relay/cmd";
    const TOPIC_IR_CMD = "smarthome/ir/cmd";
    const TOPIC_STEPPER_CMD = "smarthome/stepper/cmd";
    const TOPIC_HUSKY_CMD = "smarthome/husky/cmd";

    const TOPIC_SET_TEMP_CMD = "smarthome/setting/temp/cmd";
    const TOPIC_SET_HUM_CMD  = "smarthome/setting/hum/cmd";
    const TOPIC_SET_GAS_CMD  = "smarthome/setting/gas/cmd";

    let client = null;

    connectMQTT();

    function connectMQTT() {
      client = mqtt.connect(MQTT_BROKER, {
        clientId: CLIENT_ID,
        clean: true,
        connectTimeout: 5000,
        reconnectPeriod: 3000
      });

      client.on("connect", () => {
        console.log("MQTT connected");
        setMqttStatus(true);

        client.subscribe(TOPIC_STATUS);
        client.subscribe("smarthome/alarm/gas");
        client.subscribe("smarthome/alarm/intrude");
      });

      client.on("reconnect", () => {
        console.log("MQTT reconnecting...");
        setMqttStatus(false, "重連中");
      });

      client.on("error", (err) => {
        console.error("MQTT error:", err);
        setMqttStatus(false);
      });

      client.on("offline", () => {
        setMqttStatus(false);
      });

      client.on("message", (topic, message) => {
        const payload = message.toString();
        console.log("MQTT message:", topic, payload);

        if (topic === TOPIC_STATUS) {
          updateStatus(payload);
        }

        if (topic === "smarthome/alarm/gas") {
          document.getElementById("gasAlarmText").innerText =
            payload === "1" ? "瓦斯超標" : "正常";
          document.getElementById("gasAlarmText").className =
            payload === "1" ? "alarm" : "safe";
        }

        if (topic === "smarthome/alarm/intrude") {
          document.getElementById("intrudeText").innerText =
            payload === "1" ? "偵測到未註冊人臉" : "正常";
          document.getElementById("intrudeText").className =
            payload === "1" ? "alarm" : "safe";
        }
      });
    }

    function setMqttStatus(online, text) {
      const el = document.getElementById("mqttStatus");

      if (online) {
        el.innerText = "在線";
        el.classList.add("mqtt-online");
      } else {
        el.innerText = text || "離線";
        el.classList.remove("mqtt-online");
      }
    }

    function sendMQTT(topic, message) {
      if (!client || !client.connected) {
        alert("MQTT 尚未連線，請稍後再試");
        return;
      }

      client.publish(topic, String(message));
      console.log("MQTT Send:", topic, message);
    }

    // =====================================================
    // 狀態更新
    // =====================================================
    function updateStatus(payload) {
      let data;

      try {
        data = JSON.parse(payload);
      } catch (e) {
        console.error("JSON parse error:", e);
        return;
      }

      setText("t1", data.t1);
      setText("h1", data.h1);
      setText("g1", data.g1);

      setText("t2", data.t2);
      setText("h2", data.h2);
      setText("g2", data.g2);

      setText("modeText", data.mode);
      setText("huskyText", data.husky);
      setText("gestureText", data.gesture);
      setText("angleText", data.angle);

      setText("relayText", data.relay == 1 ? "ON" : "OFF");
      setText("unlockText", data.unlocked == 1 ? "已解鎖" : "未解鎖");

      if (data.intrude !== undefined) {
        document.getElementById("intrudeText").innerText =
          data.intrude == 1 ? "偵測到未註冊人臉" : "正常";

        document.getElementById("intrudeText").className =
          data.intrude == 1 ? "alarm" : "safe";
      }

      if (data.th_t !== undefined) {
        document.getElementById("tempThresholdInput").value = data.th_t;
      }

      if (data.th_h !== undefined) {
        document.getElementById("humThresholdInput").value = data.th_h;
      }

      if (data.th_g !== undefined) {
        document.getElementById("gasThresholdInput").value = data.th_g;
      }

      if (
        data.th_t !== undefined &&
        data.th_h !== undefined &&
        data.th_g !== undefined
      ) {
        document.getElementById("thresholdStatus").innerText =
          "目前門檻：溫度 " + data.th_t +
          " °C｜濕度 " + data.th_h +
          " %｜瓦斯 " + data.th_g;
      }

      if (data.th_g !== undefined) {
        const gasAlarm =
          Number(data.g1) >= Number(data.th_g) ||
          Number(data.g2) >= Number(data.th_g);

        document.getElementById("gasAlarmText").innerText =
          gasAlarm ? "瓦斯超標" : "正常";

        document.getElementById("gasAlarmText").className =
          gasAlarm ? "alarm" : "safe";
      }
    }

    function setText(id, value) {
      if (value === undefined || value === null || value === "") return;
      document.getElementById(id).innerText = value;
    }

    // =====================================================
    // 控制函式
    // =====================================================
    function setMode(mode) {
      sendMQTT(TOPIC_MODE_CMD, mode);
    }

    function relayControl(cmd) {
      sendMQTT(TOPIC_RELAY_CMD, cmd);
    }

    function irControl(cmd) {
      sendMQTT(TOPIC_IR_CMD, cmd);
    }

    function stepperControl(cmd) {
      sendMQTT(TOPIC_STEPPER_CMD, cmd);
    }

    function huskyMode(mode) {
      sendMQTT(TOPIC_HUSKY_CMD, mode);
    }

    function setTempThreshold() {
      const value = document.getElementById("tempThresholdInput").value;

      if (value === "") {
        alert("請輸入溫度門檻");
        return;
      }

      sendMQTT(TOPIC_SET_TEMP_CMD, value);
      alert("已送出溫度門檻：" + value + " °C");
    }

    function setHumThreshold() {
      const value = document.getElementById("humThresholdInput").value;

      if (value === "") {
        alert("請輸入濕度門檻");
        return;
      }

      sendMQTT(TOPIC_SET_HUM_CMD, value);
      alert("已送出濕度門檻：" + value + " %");
    }

    function setGasThreshold() {
      const value = document.getElementById("gasThresholdInput").value;

      if (value === "") {
        alert("請輸入瓦斯門檻");
        return;
      }

      sendMQTT(TOPIC_SET_GAS_CMD, value);
      alert("已送出瓦斯門檻：" + value);
    }
  </script>
</body>
</html>
