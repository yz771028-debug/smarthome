<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧居家控制</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:#0f172a;color:white;}
.wrap{max-width:1200px;margin:auto;padding:24px;}
h1{margin-bottom:10px;}
.status{padding:12px 16px;border-radius:12px;background:#1e293b;margin-bottom:12px;font-weight:bold;display:flex;justify-content:between;align-items:center;}
.status-tag{padding:4px 8px;border-radius:6px;font-size:14px;margin-left:10px;}
.online{background:#16a34a;}
.offline{background:#dc2626;}
.update{margin-bottom:20px;color:#cbd5e1;}
.alert{display:none;background:#7f1d1d;color:#fecaca;padding:14px;border-radius:14px;margin-bottom:18px;font-weight:bold;animation:blink 1s infinite;}
.show{display:block;}
@keyframes blink{0%{opacity:1}50%{opacity:.45}100%{opacity:1}}

/* 資訊看板佈局 */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:16px;}
.card{background:#1e293b;padding:20px;border-radius:16px;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);}
.card h2{margin-top:0;font-size:18px;color:#38bdf8;border-bottom:1px solid #334155;padding-bottom:8px;margin-bottom:12px;}

.data-row{display:flex;justify-content:between;margin:10px 0;font-size:16px;}
.data-val{font-weight:bold;color:#f8fafc;}

/* 控制按鈕樣式 */
.btn-group{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px;}
.btn-group-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
button{background:#3b82f6;color:white;border:none;padding:10px;border-radius:8px;cursor:pointer;font-weight:bold;transition:all 0.2s;}
button:hover{background:#2563eb;}
button:active{transform:scale(0.98);}
.btn-on{background:#10b981;}
.btn-on:hover{background:#059669;}
.btn-off{background:#ef4444;}
.btn-off:hover{background:#dc2626;}
.btn-purple{background:#8b5cf6;}
.btn-purple:hover{background:#7c3aed;}

/* 下拉選單 */
.select-style{width:100%;padding:10px;background:#334155;color:white;border:1px solid #475569;border-radius:8px;font-weight:bold;margin-top:8px;}

/* 原本的 Loading 效果 */
.loading{position:relative;color:transparent!important;}
.loading::after{content:"";position:absolute;width:16px;height:16px;top:50%;left:50%;margin-top:-8px;margin-left:-8px;border:2px solid white;border-top-color:transparent;border-radius:50%;animation:spin 0.6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

 #app{
  display:none;
}

#loginScreen{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#020617,#0f172a,#1e293b);
  z-index:9999;
}

.login-card{
  width:min(400px,92vw);
  background:#1e293b;
  border:1px solid #334155;
  border-radius:22px;
  padding:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.login-card h2{
  text-align:center;
  margin:0 0 8px;
}

.login-subtitle{
  text-align:center;
  color:#cbd5e1;
  font-size:14px;
  margin-bottom:18px;
}

.login-card label{
  display:block;
  margin:10px 0 6px;
  color:#cbd5e1;
}

.login-card input{
  width:78%;
  padding:10px 12px;
  border-radius:12px;
  border:1px solid #334155;
  background:#020617;
  color:white;
  margin:0 auto 10px;
  display:block;
}

.login-card button{
  width:82%;
  margin:10px auto;
  display:block;
}

.divider{
  height:1px;
  background:#334155;
  margin:18px 0;
}

.msg{
  min-height:22px;
  text-align:center;
  font-size:14px;
} 
</style>
</head>
<body>

<div class="wrap">
  <h1>智慧居家控制</h1>
  <div class="status">
    MQTT 連線狀態：<span id="mqttStatus" class="status-tag offline">斷線中</span>
    <span style="margin-left:20px;">系統目前模式：</span><span id="currentModeDisplay" style="color:#38bdf8; font-weight:bold;">自動模式 🤖</span>
  </div>
  <div class="update">最後更新時間：<span id="timeStr">--:--:--</span></div>

  <div id="gasAlert" class="alert">🚨 偵測到環境瓦斯濃度超標！系統已強制啟動風扇排氣排毒！</div>

  <div class="grid">
    <div class="card">
      <h2>⚙️ 系統主控台</h2>
      <div class="data-row">
        <span>手自動模式切換：</span>
      </div>
      <select id="modeSelect" class="select-style" onchange="changeSystemMode(this.value)">
        <option value="AUTO">自動模式 (AI 追蹤擺頭+自動溫控)</option>
        <option value="MANUAL">手動模式 (遠端解鎖、手動控制)</option>
      </select>

      <div class="data-row" style="margin-top: 20px;">
        <span>風扇繼電器狀態：</span>
        <span id="fanStateText" class="data-val">OFF</span>
      </div>
      <div class="btn-group">
        <button class="btn-on" onclick="publish('smarthome/relay/cmd', 'ON', this)">強制開啟</button>
        <button class="btn-off" onclick="publish('smarthome/relay/cmd', 'OFF', this)">強制關閉</button>
      </div>
    </div>

    <div class="card">
      <h2>🏠 房間 1 環境數據</h2>
      <div class="data-row"><span>溫度：</span><span><span id="r1-temp" class="data-val">--</span> °C</span></div>
      <div class="data-row"><span>濕度：</span><span><span id="r1-humi" class="data-val">--</span> %</span></div>
      <div class="data-row"><span>瓦斯濃度：</span><span><span id="r1-gas" class="data-val">--</span></span></div>
    </div>

    <div class="card">
      <h2>🏠 房間 2 環境數據</h2>
      <div class="data-row"><span>溫度：</span><span><span id="r2-temp" class="data-val">--</span> °C</span></div>
      <div class="data-row"><span>濕度：</span><span><span id="r2-humi" class="data-val">--</span> %</span></div>
      <div class="data-row"><span>瓦斯濃度：</span><span><span id="r2-gas" class="data-val">--</span></span></div>
    </div>
  </div>

  <div class="grid">
    <div class="card" style="grid-column: span 2;">
      <h2>📺 風扇紅外線遙控 & 步進馬達微調 (手動模式專用)</h2>
      <div class="btn-group-3">
        <button onclick="publish('smarthome/ir/cmd', 'OPEN', this)">風扇開啟</button>
        <button class="btn-off" onclick="publish('smarthome/ir/cmd', 'CLOSE', this)">風扇關閉</button>
        <button onclick="publish('smarthome/ir/cmd', 'SWING', this)">風扇擺頭</button>
        <button onclick="publish('smarthome/ir/cmd', 'UP', this)">風速 +</button>
        <button onclick="publish('smarthome/ir/cmd', 'DOWN', this)">風速 -</button>
        <button class="btn-purple" onclick="publish('smarthome/line/query', 'REQ', this)">LINE主動查詢</button>
      </div>
      
      <h3 style="font-size:15px; color:#cbd5e1; margin-top:20px; margin-bottom:8px;">🤖 步進馬達底座角度微調</h3>
      <div class="btn-group-3">
        <button onclick="publish('smarthome/ir/cmd', 'STEP=LEFT', this)">◀ 左轉微調</button>
        <button style="background:#e67e22;" onclick="publish('smarthome/ir/cmd', 'STEP=CENTER', this)">居中導正 📍</button>
        <button onclick="publish('smarthome/ir/cmd', 'STEP=RIGHT', this)">右轉微調 ▶</button>
      </div>
    </div>

    <div class="card">
      <h2>📊 視覺解鎖狀態</h2>
      <div class="data-row"><span>人臉解鎖：</span><span id="unlockState" class="data-val">未解鎖 🔒</span></div>
      <div class="data-row"><span>馬達位置步數：</span><span id="stepperState" class="data-val">--</span></div>
      <div class="data-row"><span>HuskyLens X：</span><span id="huskyX" class="data-val">--</span></div>
    </div>
  </div>
</div>

<script>
// ================= MQTT 設定區 =================
const MQTT_SERVER = "wss://broker.emqx.io:8084/mqtt"; // 使用安全加密的 WebSockets 通道
const CLIENT_ID = "Web_Dashboard_" + Math.random().toString(16).substr(2, 8);

let gas1 = 0, gas2 = 0;
const GAS_LIMIT = 1000;

const client = mqtt.connect(MQTT_SERVER, { clientId: CLIENT_ID });

client.on('connect', () => {
  const statusTag = document.getElementById("mqttStatus");
  statusTag.textContent = "已連線";
  statusTag.className = "status-tag online";

  // 訂閱所有硬體上報的狀態 Topic
  client.subscribe("smarthome/room1/temp");
  client.subscribe("smarthome/room1/humi");
  client.subscribe("smarthome/room1/gas");
  client.subscribe("smarthome/room2/temp");
  client.subscribe("smarthome/room2/humi");
  client.subscribe("smarthome/room2/gas");
  client.subscribe("smarthome/relay/state");
  client.subscribe("smarthome/alarm/gas");
  client.subscribe("smarthome/status");
  client.subscribe("smarthome/mode/state"); // 訂閱硬體當前模式
});

client.on('error', (err) => {
  console.error("MQTT 連線錯誤:", err);
  const statusTag = document.getElementById("mqttStatus");
  statusTag.textContent = "連線錯誤";
  statusTag.className = "status-tag offline";
});

client.on('message', (topic, message) => {
  const msg = message.toString().trim();
  
  // 動態解析收到的主題並渲染到網頁 UI
  if (topic === "smarthome/room1/temp") document.getElementById("r1-temp").textContent = msg;
  else if (topic === "smarthome/room1/humi") document.getElementById("r1-humi").textContent = msg;
  else if (topic === "smarthome/room1/gas") { gas1 = parseInt(msg) || 0; document.getElementById("r1-gas").textContent = msg; updateGasAlert(); }
  else if (topic === "smarthome/room2/temp") document.getElementById("r2-temp").textContent = msg;
  else if (topic === "smarthome/room2/humi") document.getElementById("r2-humi").textContent = msg;
  else if (topic === "smarthome/room2/gas") { gas2 = parseInt(msg) || 0; document.getElementById("r2-gas").textContent = msg; updateGasAlert(); }
  
  else if (topic === "smarthome/relay/state") {
    document.getElementById("fanStateText").textContent = (msg === "1" ? "ON 🟢" : "OFF 🔴");
  }
  else if (topic === "smarthome/mode/state") {
    document.getElementById("currentModeDisplay").textContent = (msg === "AUTO" ? "自動模式 🤖" : "手動模式 🎛️");
    document.getElementById("modeSelect").value = msg;
  }
  else if (topic === "smarthome/alarm/gas") {
    document.getElementById("gasAlert").classList.toggle("show", msg === "1");
  }
  
  updateTime();
});

// 瓦斯警報閃爍邏輯
function updateGasAlert(){
  const alertBox = document.getElementById("gasAlert");
  if (gas1 >= GAS_LIMIT || gas2 >= GAS_LIMIT) {
    alertBox.classList.add("show");
  } else {
    alertBox.classList.remove("show");
  }
}

// 更新即時時間
function updateTime(){
  const now = new Date();
  document.getElementById("timeStr").textContent = now.toLocaleTimeString();
}

// 原本的 Loading 動畫處理
function loading(btn){
  if (!btn) return;
  btn.classList.add("loading");
  setTimeout(() => btn.classList.remove("loading"), 500);
}

// 發送 MQTT 指令
function publish(topic, msg, btn){
  if (!client.connected) {
    alert("MQTT 尚未連線，請檢查網路狀態！");
    return;
  }
  loading(btn);
  client.publish(topic, msg, {qos:1, retain:false}, err => {
    if (err) console.error("發送失敗：", topic, msg);
  });
}

// 模式選單連動發送
function changeSystemMode(val) {
  publish("smarthome/mode/cmd", val, null);
}
</script>
</body>
</html>
