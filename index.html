<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MQTT 智慧居家控制系統</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial,"Microsoft JhengHei",sans-serif;
  background:#0f172a;
  color:white;
}
.wrap{
  max-width:1100px;
  margin:auto;
  padding:24px;
}
.status{
  padding:12px 16px;
  border-radius:12px;
  background:#1e293b;
  margin-bottom:18px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:16px;
}
.card{
  background:#1e293b;
  border:1px solid #334155;
  border-radius:18px;
  padding:18px;
}
.title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
}
.value{
  font-size:34px;
  font-weight:bold;
  margin:8px 0 16px;
}
button{
  padding:12px 18px;
  margin:6px;
  border:0;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  color:white;
  background:#2563eb;
  transition:.15s;
}
button:hover{
  transform:translateY(-2px);
  filter:brightness(1.1);
}
button:active{
  transform:scale(.95);
}
.green{background:#16a34a}
.red{background:#dc2626}
.orange{background:#ea580c}
.alert{
  display:none;
  background:#7f1d1d;
  color:#fecaca;
  padding:14px;
  border-radius:14px;
  margin-bottom:16px;
  font-weight:bold;
}
.show{
  display:block;
}
.log{
  margin-top:16px;
  background:#020617;
  border-radius:14px;
  padding:12px;
  height:120px;
  overflow:auto;
  font-size:14px;
  color:#cbd5e1;
}
</style>
</head>

<body>
<div class="wrap">

<h1>MQTT 智慧居家控制系統</h1>
<div id="mqttStatus" class="status">MQTT：連線中...</div>
<div id="gasAlert" class="alert">🚨 瓦斯濃度超標，系統已啟動警報</div>

<div class="grid">

  <div class="card">
    <div class="title">房間 1</div>
    <div>溫度</div>
    <div id="r1t" class="value">--</div>
    <div>濕度</div>
    <div id="r1h" class="value">--</div>
    <div>瓦斯</div>
    <div id="r1g" class="value">--</div>
  </div>

  <div class="card">
    <div class="title">房間 2</div>
    <div>溫度</div>
    <div id="r2t" class="value">--</div>
    <div>濕度</div>
    <div id="r2h" class="value">--</div>
    <div>瓦斯</div>
    <div id="r2g" class="value">--</div>
  </div>

  <div class="card">
    <div class="title">Relay 風扇</div>
    <div>狀態</div>
    <div id="relayState" class="value">--</div>
    <button class="green" onclick="relayOn()">開啟</button>
    <button class="red" onclick="relayOff()">關閉</button>
  </div>

  <div class="card">
    <div class="title">紅外線風扇</div>
    <button class="green" onclick="irCmd('OPEN')">開</button>
    <button class="red" onclick="irCmd('CLOSE')">關</button>
    <button onclick="irCmd('UP')">風量+</button>
    <button onclick="irCmd('DOWN')">風量-</button>
    <button class="orange" onclick="irCmd('SWING')">擺頭</button>
  </div>

</div>

<div class="log" id="log"></div>

</div>

<script>
const GAS_LIMIT = 1000;

// EMQX WebSocket Broker
const broker = "wss://broker.emqx.io:8084/mqtt";

const clientId = "web_smart_home_" + Math.floor(Math.random() * 1000000);

const client = mqtt.connect(broker, {
  clientId: clientId,
  clean: true,
  connectTimeout: 8000,
  reconnectPeriod: 3000
});

const topics = [
  "smarthome/room1/temp",
  "smarthome/room1/humi",
  "smarthome/room1/gas",
  "smarthome/room2/temp",
  "smarthome/room2/humi",
  "smarthome/room2/gas",
  "smarthome/relay/state",
  "smarthome/alarm/gas",
  "smarthome/status"
];

let gas1 = 0;
let gas2 = 0;

function log(msg){
  const el = document.getElementById("log");
  const time = new Date().toLocaleTimeString();
  el.innerHTML = `[${time}] ${msg}<br>` + el.innerHTML;
}

client.on("connect", () => {
  document.getElementById("mqttStatus").textContent = "MQTT：已連線 broker.emqx.io";
  document.getElementById("mqttStatus").style.background = "#064e3b";

  topics.forEach(t => {
    client.subscribe(t, {qos:1});
  });

  log("MQTT 已連線");
});

client.on("reconnect", () => {
  document.getElementById("mqttStatus").textContent = "MQTT：重新連線中...";
  document.getElementById("mqttStatus").style.background = "#78350f";
});

client.on("error", err => {
  document.getElementById("mqttStatus").textContent = "MQTT：連線錯誤";
  document.getElementById("mqttStatus").style.background = "#7f1d1d";
  log("MQTT 錯誤：" + err.message);
});

client.on("message", (topic, message) => {
  const msg = message.toString();

  if (topic === "smarthome/room1/temp") {
    document.getElementById("r1t").textContent = msg + " °C";
  }
  else if (topic === "smarthome/room1/humi") {
    document.getElementById("r1h").textContent = msg + " %";
  }
  else if (topic === "smarthome/room1/gas") {
    gas1 = Number(msg);
    document.getElementById("r1g").textContent = msg;
  }
  else if (topic === "smarthome/room2/temp") {
    document.getElementById("r2t").textContent = msg + " °C";
  }
  else if (topic === "smarthome/room2/humi") {
    document.getElementById("r2h").textContent = msg + " %";
  }
  else if (topic === "smarthome/room2/gas") {
    gas2 = Number(msg);
    document.getElementById("r2g").textContent = msg;
  }
  else if (topic === "smarthome/relay/state") {
    document.getElementById("relayState").textContent = msg === "1" ? "ON" : "OFF";
  }
  else if (topic === "smarthome/alarm/gas") {
    document.getElementById("gasAlert").classList.toggle("show", msg === "1");
  }
  else if (topic === "smarthome/status") {
    log("ESP 狀態：" + msg);
  }

  updateGasAlert();
});

function updateGasAlert(){
  const alertBox = document.getElementById("gasAlert");

  if (gas1 >= GAS_LIMIT || gas2 >= GAS_LIMIT) {
    alertBox.classList.add("show");
  } else {
    alertBox.classList.remove("show");
  }
}

function publish(topic, msg){
  if (!client.connected) {
    alert("MQTT 尚未連線");
    return;
  }

  client.publish(topic, msg, {
    qos: 1,
    retain: false
  }, err => {
    if (err) {
      log("送出失敗：" + topic + " → " + msg);
    } else {
      log("送出：" + topic + " → " + msg);
    }
  });
}

function relayOn(){
  publish("smarthome/relay/cmd", "ON");
}

function relayOff(){
  publish("smarthome/relay/cmd", "OFF");
}

function irCmd(cmd){
  publish("smarthome/ir/cmd", cmd);
}
</script>

</body>
</html>
