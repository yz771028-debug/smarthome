<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智慧居家控制系統</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#0b1220;
  --card:#131c2f;
  --line:#24324f;
  --text:#eef4ff;
  --muted:#9db0d6;
  --good:#2dd4bf;
  --warn:#facc15;
  --danger:#fb7185;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Microsoft JhengHei";
  background:linear-gradient(180deg,#0b1220,#10192b);
  color:var(--text);
}
.wrap{max-width:1100px;margin:auto;padding:20px;}
.card{background:var(--card);padding:16px;border-radius:14px;margin-bottom:16px;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.room{grid-column:span 6}
.sensor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sensor{background:#0d1525;padding:12px;border-radius:10px}
.value{font-size:26px;font-weight:bold}
button{padding:10px 14px;border:none;border-radius:10px;background:#2563eb;color:white;cursor:pointer}

.login{
  display:flex;justify-content:center;align-items:center;height:100vh;
}
.login-box{
  background:var(--card);
  padding:20px;border-radius:12px;width:320px
}
input{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid var(--line);background:#0d1525;color:white}
.tab{display:flex;gap:8px;margin-bottom:10px}
.tab button{flex:1}
.active{outline:2px solid #60a5fa}
.hide{display:none}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login">
  <div class="login-box">
    <h2>登入系統</h2>

    <div class="tab">
      <button id="tabLogin" class="active" onclick="setTab('login')">登入</button>
      <button id="tabReg" onclick="setTab('register')">註冊</button>
    </div>

    <form id="loginForm">
      <input id="loginUser" placeholder="帳號" required>
      <input id="loginPass" type="password" placeholder="密碼" required>
      <button type="submit">登入</button>
      <div id="loginMsg"></div>
    </form>

    <form id="registerForm" class="hide">
      <input id="regUser" placeholder="新帳號" required>
      <input id="regPass" type="password" placeholder="新密碼" required>
      <button type="submit">註冊</button>
      <div id="regMsg"></div>
    </form>

  </div>
</div>

<!-- SYSTEM -->
<div id="app" class="wrap hide">
  <div class="card">
    <h2>智慧居家控制系統</h2>
  </div>

  <div class="grid">

    <div class="card room">
      <h3>房間1</h3>
      <div class="sensor-grid">
        <div class="sensor">溫度<div class="value" id="t1">--</div></div>
        <div class="sensor">濕度<div class="value" id="h1">--</div></div>
        <div class="sensor">瓦斯<div class="value" id="g1">--</div></div>
      </div>
    </div>

    <div class="card room">
      <h3>房間2</h3>
      <div class="sensor-grid">
        <div class="sensor">溫度<div class="value" id="t2">--</div></div>
        <div class="sensor">濕度<div class="value" id="h2">--</div></div>
        <div class="sensor">瓦斯<div class="value" id="g2">--</div></div>
      </div>
    </div>

    <div class="card">
      <h3>控制</h3>
      <button onclick="setRelay(1)">ON</button>
      <button onclick="setRelay(0)">OFF</button>
      <button onclick="logout()">登出</button>
    </div>

    <div class="card">
      <h3>瓦斯圖表</h3>
      <canvas id="chart"></canvas>
    </div>

  </div>
</div>

<script>
const ACCOUNT_KEY = "smarthome_account";
const DEFAULT_ACCOUNT = { username:"admin", password:"123456" };
let chart;

function setTab(mode){
  const isLogin = mode === 'login';

  // 登入/註冊表單切換（修正版）
  document.getElementById('loginForm').classList.toggle('hide', !isLogin);
  document.getElementById('registerForm').classList.toggle('hide', isLogin);

  document.getElementById('tabLogin').classList.toggle('active', isLogin);
  document.getElementById('tabReg').classList.toggle('active', !isLogin);
}

function saveAccount(a){localStorage.setItem(ACCOUNT_KEY,JSON.stringify(a));}
function getAccount(){return JSON.parse(localStorage.getItem(ACCOUNT_KEY))||DEFAULT_ACCOUNT;}

// LOGIN
loginForm.onsubmit=e=>{
  e.preventDefault();
  const u=loginUser.value,p=loginPass.value;
  const a=getAccount();
  if(u===a.username&&p===a.password) start();
  else loginMsg.innerText="錯誤";
};

registerForm.onsubmit = (e) => {
  e.preventDefault();

  const username = regUser.value.trim();
  const password = regPass.value;
  const msg = document.getElementById('regMsg');

  msg.textContent = '';
  msg.style.color = '#fb7185';

  // 基本驗證
  if (username.length < 3) {
    msg.textContent = '帳號至少需要 3 個字元';
    return;
  }

  if (password.length < 6) {
    msg.textContent = '密碼至少需要 6 個字元';
    return;
  }

  // 檢查是否已存在
  const existing = getAccount();
  if (existing.username === username) {
    msg.textContent = '此帳號已存在，請換一個';
    return;
  }

  // 儲存帳號
  saveAccount({ username, password });

  msg.style.color = '#2dd4bf';
  msg.textContent = '註冊成功！請切換到登入頁登入';

  registerForm.reset();
};

function start(){
  loginScreen.classList.add('hide');
  app.classList.remove('hide');
  initChart();
  loadData();
  setInterval(loadData,5000);
}

// MOCK DATA (你之後可接 ThingSpeak)
function loadData(){
  t1.innerText=25+Math.random()*5;
  h1.innerText=60+Math.random()*5;
  g1.innerText=200+Math.random()*50;

  t2.innerText=26+Math.random()*5;
  h2.innerText=55+Math.random()*5;
  g2.innerText=180+Math.random()*50;

  chart.data.labels.push('');
  chart.data.datasets[0].data.push(g1.innerText);
  chart.update();
}

function initChart(){
  chart=new Chart(document.getElementById('chart'),{
    type:'line',
    data:{labels:[],datasets:[{label:'瓦斯',data:[],borderColor:'#fb7185'}]}
  });
}

function setRelay(v){alert("Relay: "+v);}
function logout(){location.reload();}

setTab('login');
</script>

</body>
</html>
