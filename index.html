<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MQTT 智慧居家控制系統</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial,"Microsoft JhengHei",sans-serif;
  background:#0f172a;
  color:white;
}

.wrap{
  max-width:1200px;
  margin:auto;
  padding:24px;
}

h1{
  margin-bottom:10px;
}

.status{
  padding:12px 16px;
  border-radius:12px;
  background:#1e293b;
  margin-bottom:12px;
  font-weight:bold;
}

.update{
  margin-bottom:20px;
  color:#cbd5e1;
}

.alert{
  display:none;
  background:#7f1d1d;
  color:#fecaca;
  padding:14px;
  border-radius:14px;
  margin-bottom:18px;
  font-weight:bold;
  animation: blink 1s infinite;
}

.show{
  display:block;
}

@keyframes blink{
  0%{opacity:1}
  50%{opacity:.45}
  100%{opacity:1}
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:16px;
}

.card{
  background:#1e293b;
  border:1px solid #334155;
  border-radius:18px;
  padding:18px;
  box-shadow:0 4px 10px rgba(0,0,0,.2);
}

.title{
  font-size:22px;
  font-weight:bold;
  margin-bottom:16px;
}

.label{
  font-size:15px;
  color:#cbd5e1;
}

.value{
  font-size:34px;
  font-weight:bold;
  margin:8px 0 16px;
}

button{
  position:relative;
  padding:12px 18px;
  margin:6px;
  border:0;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  color:white;
  background:#2563eb;
  transition:.15s;
}

button:hover{
  transform:translateY(-2px);
  filter:brightness(1.1);
}

button:active{
  transform:scale(.95);
}

button.loading{
  opacity:.6;
  pointer-events:none;
}

button.loading::after{
  content:"";
  width:14px;
  height:14px;
  border:2px solid white;
  border-top-color:transparent;
  border-radius:50%;
  position:absolute;
  right:8px;
  top:50%;
  margin-top:-7px;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.green{background:#16a34a}
.red{background:#dc2626}
.orange{background:#ea580c}

.log{
  margin-top:20px;
  background:#020617;
  border-radius:14px;
  padding:14px;
  height:160px;
  overflow:auto;
  font-size:14px;
  color:#cbd5e1;
}

.footer{
  margin-top:20px;
  color:#94a3b8;
  font-size:14px;
}
</style>
</head>

<body>

<div class="wrap">

<h1>MQTT 智慧居家控制系統</h1>

<div id="mqttStatus" class="status">
MQTT：連線中...
</div>

<div id="lastUpdate" class="update">
最後更新：--
</div>

<div id="gasAlert" class="alert">
🚨 瓦斯濃度超標，系統已啟動警報
</div>

<div class="grid">

  <!-- 房間1 -->
  <div class="card">
    <div class="title">房間 1</div>

    <div class="label">溫度</div>
    <div id="r1t" class="value">--</div>

    <div class="label">濕度</div>
    <div id="r1h" class="value">--</div>

    <div class="label">瓦斯</div>
    <div id="r1g" class="value">--</div>
  </div>

  <!-- 房間2 -->
  <div class="card">
    <div class="title">房間 2</div>

    <div class="label">溫度</div>
    <div id="r2t" class="value">--</div>

    <div class="label">濕度</div>
    <div id="r2h" class="value">--</div>

    <div class="label">瓦斯</div>
    <div id="r2g" class="value">--</div>
  </div>

  <!-- Relay -->
  <div class="card">
    <div class="title">Relay 風扇</div>

    <div class="label">狀態</div>
    <div id="relayState" class="value">--</div>

    <button class="green" onclick="relayOn(this)">
      開啟
    </button>

    <button class="red" onclick="relayOff(this)">
      關閉
    </button>
  </div>

  <!-- IR -->
  <div class="card">
    <div class="title">紅外線風扇</div>

    <button class="green" onclick="irCmd('OPEN', this)">
      開
    </button>

    <button class="red" onclick="irCmd('CLOSE', this)">
      關
    </button>

    <button onclick="irCmd('UP', this)">
      風量+
    </button>

    <button onclick="irCmd('DOWN', this)">
      風量-
    </button>

    <button class="orange" onclick="irCmd('SWING', this)">
      擺頭
    </button>
  </div>

</div>

<div class="log" id="log"></div>

<div class="footer">
MQTT Broker：broker.emqx.io
</div>

</div>

<script>

// ===== MQTT =====
const broker = "wss://broker.emqx.io:8084/mqtt";

const clientId =
  "web_smart_home_" +
  Math.floor(Math.random() * 1000000);

const client = mqtt.connect(broker, {
  clientId: clientId,
  clean: true,
  connectTimeout: 8000,
  reconnectPeriod: 5000
});

// ===== Topic =====
const topics = [
  "smarthome/room1/temp",
  "smarthome/room1/humi",
  "smarthome/room1/gas",

  "smarthome/room2/temp",
  "smarthome/room2/humi",
  "smarthome/room2/gas",

  "smarthome/relay/state",
  "smarthome/alarm/gas",
  "smarthome/status"
];

const GAS_LIMIT = 1000;

let gas1 = 0;
let gas2 = 0;

// ===== LOG =====
function log(msg){

  const el = document.getElementById("log");

  const time =
    new Date().toLocaleTimeString();

  el.innerHTML =
    `[${time}] ${msg}<br>` +
    el.innerHTML;
}

// ===== 更新時間 =====
function updateTime(){

  const now = new Date();

  document.getElementById("lastUpdate")
    .textContent =
    "最後更新：" +
    now.toLocaleTimeString();
}

// ===== MQTT Connect =====
client.on("connect", () => {

  const status =
    document.getElementById("mqttStatus");

  status.textContent =
    "MQTT：已連線 broker.emqx.io";

  status.style.background =
    "#064e3b";

  topics.forEach(t => {
    client.subscribe(t, {
      qos:1
    });
  });

  log("MQTT 已連線");
});

// ===== MQTT Reconnect =====
client.on("reconnect", () => {

  const status =
    document.getElementById("mqttStatus");

  status.textContent =
    "MQTT：重新連線中...";

  status.style.background =
    "#78350f";

  log("MQTT 重新連線");
});

// ===== MQTT Error =====
client.on("error", err => {

  const status =
    document.getElementById("mqttStatus");

  status.textContent =
    "MQTT：連線錯誤";

  status.style.background =
    "#7f1d1d";

  log("MQTT 錯誤：" + err.message);
});

// ===== 收到 MQTT =====
client.on("message",
(topic, message) => {

  const msg =
    message.toString();

  // Room1
  if (topic === "smarthome/room1/temp") {

    document.getElementById("r1t")
      .textContent =
      msg + " °C";
  }

  else if (
    topic === "smarthome/room1/humi"
  ) {

    document.getElementById("r1h")
      .textContent =
      msg + " %";
  }

  else if (
    topic === "smarthome/room1/gas"
  ) {

    gas1 = Number(msg);

    document.getElementById("r1g")
      .textContent = msg;
  }

  // Room2
  else if (
    topic === "smarthome/room2/temp"
  ) {

    document.getElementById("r2t")
      .textContent =
      msg + " °C";
  }

  else if (
    topic === "smarthome/room2/humi"
  ) {

    document.getElementById("r2h")
      .textContent =
      msg + " %";
  }

  else if (
    topic === "smarthome/room2/gas"
  ) {

    gas2 = Number(msg);

    document.getElementById("r2g")
      .textContent = msg;
  }

  // Relay
  else if (
    topic === "smarthome/relay/state"
  ) {

    document.getElementById("relayState")
      .textContent =
      msg === "1"
      ? "ON"
      : "OFF";
  }

  // Gas Alarm
  else if (
    topic === "smarthome/alarm/gas"
  ) {

    document.getElementById("gasAlert")
      .classList.toggle(
        "show",
        msg === "1"
      );
  }

  // Status
  else if (
    topic === "smarthome/status"
  ) {

    log("ESP 狀態：" + msg);
  }

  updateGasAlert();
  updateTime();
});

// ===== 瓦斯警報 =====
function updateGasAlert(){

  const alertBox =
    document.getElementById("gasAlert");

  if (
    gas1 >= GAS_LIMIT ||
    gas2 >= GAS_LIMIT
  ) {

    alertBox.classList.add("show");

  } else {

    alertBox.classList.remove("show");
  }
}

// ===== 按鈕動畫 =====
function loading(btn){

  if (!btn) return;

  btn.classList.add("loading");

  setTimeout(() => {

    btn.classList.remove("loading");

  }, 700);
}

// ===== Publish =====
function publish(topic, msg, btn){

  if (!client.connected) {

    alert("MQTT 尚未連線");
    return;
  }

  loading(btn);

  client.publish(
    topic,
    msg,
    {
      qos:1,
      retain:false
    },

    err => {

      if (err) {

        log(
          "送出失敗：" +
          topic +
          " → " +
          msg
        );

      } else {

        log(
          "送出：" +
          topic +
          " → " +
          msg
        );
      }
    }
  );
}

// ===== Relay =====
function relayOn(btn){

  publish(
    "smarthome/relay/cmd",
    "ON",
    btn
  );
}

function relayOff(btn){

  publish(
    "smarthome/relay/cmd",
    "OFF",
    btn
  );
}

// ===== IR =====
function irCmd(cmd, btn){

  publish(
    "smarthome/ir/cmd",
    cmd,
    btn
  );
}

</script>

</body>
</html>
