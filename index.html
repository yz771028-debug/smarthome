<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧居家控制系統</</title>
<title>雙房間智慧居家控制系統</title>
 
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Arial,"Microsoft JhengHei";
  background:#0b1220;
  color:white;
}

.wrap{max-width:1100px;margin:auto;padding:20px;}

.card{
  background:#131c2f;
  padding:16px;
  border-radius:14px;
  margin-bottom:16px;
}

.sensor-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.sensor{
  background:#0d1525;
  padding:10px;
  border-radius:10px;
}

.value{
  font-size:28px;
  font-weight:bold;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  margin:5px;
}

#app{display:none;}

.login{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.login-box{
  background:#131c2f;
  padding:20px;
  border-radius:12px;
  width:300px;
}
</style>
</head>

<body>

<!-- 登入 -->
<div id="loginScreen" class="login">
  <div class="login-box">
    <h2>登入</h2>
    <input id="user" placeholder="帳號"><br><br>
    <input id="pass" type="password" placeholder="密碼"><br><br>
    <button onclick="login()">登入</button>
    <div id="msg"></div>
  </div>
</div>

<!-- 系統 -->
<div id="app" class="wrap">

  <div class="card">
    <h2>雙房間系統</h2>
  </div>

  <div class="card">
    <h3>房間1</h3>
    <div class="sensor-grid">
      <div class="sensor">溫度<div id="r1t" class="value">--</div></div>
      <div class="sensor">濕度<div id="r1h" class="value">--</div></div>
      <div class="sensor">瓦斯<div id="r1g" class="value">--</div></div>
    </div>
  </div>

  <div class="card">
    <h3>房間2</h3>
    <div class="sensor-grid">
      <div class="sensor">溫度<div id="r2t" class="value">--</div></div>
      <div class="sensor">濕度<div id="r2h" class="value">--</div></div>
      <div class="sensor">瓦斯<div id="r2g" class="value">--</div></div>
    </div>
  </div>

  <div class="card">
    <h3>瓦斯趨勢</h3>
    <canvas id="chart"></canvas>
  </div>

  <div class="card">
    <h3>控制</h3>
    <button onclick="setRelay(1)">Relay ON</button>
    <button onclick="setRelay(0)">Relay OFF</button>
  </div>

</div>

<script>

const SENSOR_CHANNEL = 3271973;
const RELAY_CHANNEL = 3277178;
const RELAY_WRITE_KEY = "OIX0C2JRKET8RVKK";
const RELAY_READ_KEY = "GXZB8HZNOGR3U2SH";

const GAS_WARN = 350;

// ========== Chart ==========
const ctx = document.getElementById("chart");
const chart = new Chart(ctx, {
  type: "line",
  data: {
    labels: [],
    datasets: [
      { label: "房間1瓦斯", data: [], borderColor: "#fb7185" },
      { label: "房間2瓦斯", data: [], borderColor: "#2dd4bf" }
    ]
  }
});

// ========== login ==========
function login(){
  const u = document.getElementById("user").value;
  const p = document.getElementById("pass").value;

  if(u === "admin" && p === "123456"){
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "block";
    start();
  } else {
    document.getElementById("msg").innerText = "錯誤";
  }
}

// ========== sensors ==========
async function getSensors(){
  try{
    const res = await fetch(`https://api.thingspeak.com/channels/${SENSOR_CHANNEL}/feeds.json?results=20`);
    const data = await res.json();

    const f = data.feeds;
    if(!f || !f.length) return;

    const last = f[f.length-1];

    set("r1t", last.field1);
    set("r1h", last.field2);
    set("r1g", last.field3);

    set("r2t", last.field4);
    set("r2h", last.field5);
    set("r2g", last.field6);

    chart.data.labels = f.map((_,i)=>i);
    chart.data.datasets[0].data = f.map(x=>Number(x.field3));
    chart.data.datasets[1].data = f.map(x=>Number(x.field6));
    chart.update();

  } catch(e){
    console.log("sensor error", e);
  }
}

function set(id,val){
  const el = document.getElementById(id);
  if(!el) return;
  el.innerText = val ?? "--";
}

// ========== relay ==========
async function setRelay(v){
  await fetch(`https://api.thingspeak.com/update?api_key=${RELAY_WRITE_KEY}&field1=${v}`);
}

async function getRelay(){
  try{
    const res = await fetch(`https://api.thingspeak.com/channels/${RELAY_CHANNEL}/feeds/last.json?api_key=${RELAY_READ_KEY}`);
    const d = await res.json();
    console.log("relay:", d.field1);
  }catch(e){}
}

// ========== start ==========
function start(){
  getSensors();
  getRelay();
  setInterval(getSensors, 5000);
  setInterval(getRelay, 5000);
}

</script>

</body>
</html>
