<div class="top-status">
  <div id="mqtt-status" class="status-pill disconnected">MQTT：連線中...</div>

  <div id="mode-status" class="mode-banner mode-auto">
    系統模式：<span id="txt-mode">連線中...</span>
  </div>

  <div class="status-pill">
    最後更新：<span id="last-update">--</span>
  </div>
</div>

<div id="gas-alert" class="alert">
  🚨 瓦斯濃度超標！系統已啟動安全警報
</div>

<div id="security-alert" class="alert">
  🚨 深夜防盜警報！偵測到未註冊人臉
</div>

<div class="room-card">
  <div class="room-title">房間 1</div>

  <div class="sensor-grid">
    <div class="sensor-box">
      <div class="sensor-label">🌡️ 溫度</div>
      <div id="v-t1" class="sensor-value">--.-</div>
      <div class="sensor-unit">°C</div>
    </div>

    <div class="sensor-box">
      <div class="sensor-label">💧 濕度</div>
      <div id="v-h1" class="sensor-value">--.-</div>
      <div class="sensor-unit">%</div>
    </div>

    <div class="sensor-box">
      <div class="sensor-label">⚠️ 瓦斯</div>
      <div id="v-g1" class="sensor-value">----</div>
      <div class="sensor-unit">ppm</div>
    </div>
  </div>
</div>

<div class="room-card">
  <div class="room-title">房間 2</div>

  <div class="sensor-grid">
    <div class="sensor-box">
      <div class="sensor-label">🌡️ 溫度</div>
      <div id="v-t2" class="sensor-value">--.-</div>
      <div class="sensor-unit">°C</div>
    </div>

    <div class="sensor-box">
      <div class="sensor-label">💧 濕度</div>
      <div id="v-h2" class="sensor-value">--.-</div>
      <div class="sensor-unit">%</div>
    </div>

    <div class="sensor-box">
      <div class="sensor-label">⚠️ 瓦斯</div>
      <div id="v-g2" class="sensor-value">----</div>
      <div class="sensor-unit">ppm</div>
    </div>
  </div>
</div>

<div class="state-card">
  <div class="state-title">🌬️ Relay 排風扇</div>
  <div id="v-relay" class="state-value">--</div>
</div>

<div class="state-card">
  <div class="state-title">👮 防盜狀態</div>
  <div id="v-intrude" class="state-value">--</div>
</div>

<div class="state-card">
  <div class="state-title">📷 HuskyLens 模式</div>
  <div id="v-husky" class="state-value">--</div>
</div>

<div class="state-card">
  <div class="state-title">✋ 最近手勢</div>
  <div id="v-gesture" class="state-value">--</div>
</div>

<div class="control-card">
  <h3>系統模式切換</h3>
  <button class="btn-green" onclick="sendMQTT('smarthome/mode/cmd', 'AUTO')">
    ☀️ 自動模式
  </button>
  <button class="btn-blue" onclick="sendMQTT('smarthome/mode/cmd', 'MANUAL')">
    🎛️ 手動模式
  </button>
  <button class="btn-red" onclick="sendMQTT('smarthome/mode/cmd', 'SECURITY')">
    👮 深夜防盜
  </button>
</div>

<div class="control-card">
  <h3>HuskyLens 模式切換</h3>
  <button class="btn-blue" onclick="sendMQTT('smarthome/husky/cmd', 'FACE')">
    👤 人臉辨識模式
  </button>
  <button class="btn-purple" onclick="sendMQTT('smarthome/husky/cmd', 'HAND')">
    ✋ 手勢辨識模式
  </button>
</div>

<div class="control-card">
  <h3>排風扇 Relay 控制</h3>
  <button class="btn-blue" onclick="sendMQTT('smarthome/relay/cmd', 'ON')">
    開啟排風扇
  </button>
  <button class="btn-red" onclick="sendMQTT('smarthome/relay/cmd', 'OFF')">
    關閉排風扇
  </button>
</div>

<div class="control-card">
  <h3>紅外線風扇控制</h3>
  <button class="btn-green" onclick="sendMQTT('smarthome/ir/cmd', 'OPEN')">
    開風扇 + 風量+
  </button>
  <button class="btn-red" onclick="sendMQTT('smarthome/ir/cmd', 'CLOSE')">
    關風扇
  </button>
  <button class="btn-blue" onclick="sendMQTT('smarthome/ir/cmd', 'UP')">
    風量+
  </button>
  <button class="btn-blue" onclick="sendMQTT('smarthome/ir/cmd', 'DOWN')">
    風量-
  </button>
  <button class="btn-orange" onclick="sendMQTT('smarthome/ir/cmd', 'SWING')">
    擺頭
  </button>
</div>

<div class="control-card">
  <h3>步進馬達手動控制</h3>
  <button class="btn-purple" onclick="sendMQTT('smarthome/stepper/cmd', 'LEFT')">
    ⬅️ 左轉
  </button>
  <button class="btn-purple" onclick="sendMQTT('smarthome/stepper/cmd', 'CENTER')">
    🎯 回中心
  </button>
  <button class="btn-purple" onclick="sendMQTT('smarthome/stepper/cmd', 'RIGHT')">
    ➡️ 右轉
  </button>
</div>
