<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<style>
body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:#0f172a;color:white;}
.wrap{max-width:1200px;margin:auto;padding:24px;}
h1{margin-bottom:10px;}
.status{padding:12px 16px;border-radius:12px;background:#1e293b;margin-bottom:12px;font-weight:bold;}

/* ===== 新增：人臉識別視覺狀態面板樣式 ===== */
.face-status {padding:12px 16px;border-radius:12px;margin-bottom:12px;font-weight:bold;transition:all 0.4s ease;}
.face-locked {background:#7f1d1d; color:#fecaca; border:1px solid #b91c1c;}
.face-unlocked {background:#064e3b; color:#a7f3d0; border:1px solid #059669;}

.update{margin-bottom:20px;color:#cbd5e1;}
.alert{display:none;background:#7f1d1d;color:#fecaca;padding:14px;border-radius:14px;margin-bottom:18px;font-weight:bold;animation:blink 1s infinite;}
.show{display:block;}
@keyframes blink{0%{opacity:1}50%{opacity:.45}100%{opacity:1}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
.card{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:18px;box-shadow:0 4px 10px rgba(0,0,0,.2);}
.title{font-size:22px;font-weight:bold;margin-bottom:16px;}
.label{font-size:15px;color:#cbd5e1;}
.value{font-size:34px;font-weight:bold;margin:8px 0 16px;}
.small-value{font-size:22px;font-weight:bold;margin:8px 0 16px;color:#e2e8f0;word-break:break-word;}
button{position:relative;padding:12px 18px;margin:6px;border:0;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;color:white;background:#2563eb;transition:.15s;}
button:hover{transform:translateY(-2px);filter:brightness(1.1);}
button:active{transform:scale(.95);}
button.loading{opacity:.6;pointer-events:none;}
button.loading::after{content:"";width:14px;height:14px;border:2px solid white;border-top-color:transparent;border-radius:50%;position:absolute;right:8px;top:50%;margin-top:-7px;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.green{background:#16a34a}.red{background:#dc2626}.orange{background:#ea580c}.purple{background:#7c3aed}.gray{background:#64748b}.cyan{background:#0891b2}
.log{margin-top:20px;background:#020617;border-radius:14px;padding:14px;height:160px;overflow:auto;font-size:14px;color:#cbd5e1;}
.footer{margin-top:20px;color:#94a3b8;font-size:14px;}
#app{display:none;}
#loginScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#020617,#0f172a,#1e293b);z-index:9999;}
.login-card{width:min(420px,92vw);background:#1e293b;border:1px solid #334155;border-radius:22px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.45);}
.login-card h2{text-align:center;margin:0 0 8px;}
.login-subtitle{text-align:center;color:#cbd5e1;font-size:14px;margin-bottom:18px;}
.login-card label{display:block;margin:10px 0 6px;color:#cbd5e1;}
.login-card input{width:78%;padding:10px 12px;border-radius:12px;border:1px solid #334155;background:#020617;color:white;margin-bottom:10px;display:block;margin-left:auto;margin-right:auto;font-size:15px;}
.login-card button{width:100%;margin:8px 0;}
.divider{height:1px;background:#334155;margin:18px 0;}
.msg{min-height:22px;text-align:center;font-size:14px;}
</style>
</head>

<body>
<div id="loginScreen">
  <div class="login-card">
    <h2>智慧居家系統登入</h2>
    <div class="login-subtitle">請先登入後進入 MQTT 控制介面</div>
    <label>帳號</label><input id="loginUsername" type="text" placeholder="請輸入帳號">
    <label>密碼</label><input id="loginPassword" type="password" placeholder="請輸入密碼">
    <button id="loginBtn" type="button">登入</button>
    <div id="loginMsg" class="msg"></div>
    <div class="divider"></div>
    <h3>註冊帳號</h3>
    <label>新帳號</label><input id="registerUsername" type="text" placeholder="至少 3 個字元">
    <label>新密碼</label><input id="registerPassword" type="password" placeholder="至少 6 個字元">
    <label>金鑰</label><input id="registerCode" type="password" placeholder="請輸入邀請碼">
    <button id="registerBtn" type="button">建立帳號</button>
    <div id="registerMsg" class="msg"></div>
  </div>
</div>

<div id="app" class="wrap">
<div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
  <h1 style="margin:0">控制介面</h1>
  <button id="logoutBtn" class="red" type="button">登出</button>
</div>

<h1>MQTT 智慧居家控制系統</h1>
<div id="mqttStatus" class="status">MQTT：連線中...</div>

<div id="faceLockStatus" class="face-status face-locked">人臉鎖安全認證：系統鎖定中 🔒 (請在室內機前進行刷臉辨識)</div>

<div id="lastUpdate" class="update">最後更新：--</div>
<div id="gasAlert" class="alert">⚠️ 瓦斯濃度超標，系統已啟動警報</div>

<div class="grid">
  <div class="card">
    <div class="title">房間 1</div>
    <div class="label">溫度</div><div id="r1t" class="value">--</div>
    <div class="label">濕度</div><div id="r1h" class="value">--</div>
    <div class="label">瓦斯</div><div id="r1g" class="value">--</div>
  </div>

  <div class="card">
    <div class="title">房間 2</div>
    <div class="label">溫度</div><div id="r2t" class="value">--</div>
    <div class="label">濕度</div><div id="r2h" class="value">--</div>
    <div class="label">瓦斯</div><div id="r2g" class="value">--</div>
  </div>

  <div class="card">
    <div class="title">Relay 風扇</div>
    <div class="label">狀態</div><div id="relayState" class="value">--</div>
    <button class="green" onclick="relayOn(this)">開啟</button>
    <button class="red" onclick="relayOff(this)">關閉</button>
  </div>

  <div class="card">
    <div class="title">紅外線風扇</div>
    <button class="green" onclick="irCmd('OPEN', this)">開</button>
    <button class="red" onclick="irCmd('CLOSE', this)">關</button>
    <button onclick="irCmd('UP', this)">風量+</button>
    <button onclick="irCmd('DOWN', this)">風量-</button>
    <button class="orange" onclick="irCmd('SWING', this)">擺頭</button>
  </div>

  <div class="card">
    <div class="title">步進馬達 / HUSKYLENS 追蹤</div>
    <div class="label">馬達狀態</div><div id="stepperState" class="small-value">--</div>
    <div class="label">HUSKYLENS X 座標</div><div id="huskyX" class="value">--</div>
    <div class="label">辨識來源</div><div id="huskySource" class="small-value">--</div>
    <button class="purple" onclick="stepperCmd('AUTO', this)">HUSKYLENS 自動追蹤</button>
    <button class="gray" onclick="stepperCmd('MANUAL', this)">手動模式</button>
    <button class="blue" onclick="stepperCmd('L', this)">左固定角度</button>
    <button class="blue" onclick="stepperCmd('R', this)">右固定角度</button>
    <button class="orange" onclick="stepperCmd('JL', this)">左旋微調</button>
    <button class="orange" onclick="stepperCmd('JR', this)">右旋微調</button>
    <button class="cyan" onclick="stepperCmd('C', this)">自動回歸中心</button>
    <button class="red" onclick="stepperCmd('S', this)">停止馬達</button>
  </div>
</div>

<div class="log" id="log"></div>
<div class="footer">MQTT Broker：broker.emqx.io</div>
</div>

<script>
// ===== Firebase =====
const firebaseConfig = {
  apiKey: "AIzaSyBWAR545ZiCCAL49PqhbeYVl5eZ9iXnBr8",
  authDomain: "smart-home-security-b06fe.firebaseapp.com",
  databaseURL: "https://smart-home-security-b06fe-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "smart-home-security-b06fe",
  storageBucket: "smart-home-security-b06fe.firebasestorage.app",
  messagingSenderId: "592787545772",
  appId: "1:592787545772:web:3c29eb9f326e919b04c909",
  measurementId: "G-M29H6DB7YD"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ===== 登入 / 註冊 =====
document.addEventListener("DOMContentLoaded", () => {
  const INVITE_CODE = "123456";
  const registerBtn = document.getElementById("registerBtn");
  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  function unlockApp(){
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "block";
  }

  loginBtn.addEventListener("click", async ()=>{
    const user = document.getElementById("loginUsername").value.trim();
    const pass = document.getElementById("loginPassword").value;
    const msg = document.getElementById("loginMsg");
    msg.style.color = "#fca5a5";
    msg.textContent = "";
    if(user === "" || pass === ""){
      msg.textContent = "請輸入帳號與密碼";
      return;
    }
    try{
      const snapshot = await db.ref("users/" + user).once("value");
      if(!snapshot.exists()){
        msg.textContent = "帳號不存在";
        return;
      }
      const data = snapshot.val();
      if(data.password === pass){
        unlockApp();
      }else{
        msg.textContent = "密碼錯誤";
      }
    }catch(error){
      console.log(error);
      msg.textContent = "雲端登入失敗";
    }
  });

  registerBtn.addEventListener("click", async ()=>{
    const user = document.getElementById("registerUsername").value.trim();
    const pass = document.getElementById("registerPassword").value;
    const code = document.getElementById("registerCode").value.trim();
    const msg = document.getElementById("registerMsg");
    msg.style.color = "#fca5a5";
    msg.textContent = "";
    if(code !== INVITE_CODE){msg.textContent = "金鑰錯誤";return;}
    if(user.length < 3){msg.textContent = "帳號至少需要 3 個字元";return;}
    if(pass.length < 6){msg.textContent = "密碼至少需要 6 個字元";return;}
    try{
      const snapshot = await db.ref("users/" + user).once("value");
      if(snapshot.exists()){
        msg.textContent = "帳號已存在";
        return;
      }
      await db.ref("users/" + user).set({username:user,password:pass,createdAt:Date.now()});
      msg.style.color = "#86efac";
      msg.textContent = "註冊成功 🌟 請登入";
      document.getElementById("registerUsername").value = "";
      document.getElementById("registerPassword").value = "";
      document.getElementById("registerCode").value = "";
    }catch(error){
      console.log(error);
      msg.textContent = "雲端註冊失敗";
    }
  });

  logoutBtn.addEventListener("click",()=>{
    document.getElementById("app").style.display = "none";
    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("loginPassword").value = "";
    document.getElementById("loginMsg").textContent = "";
  });
});

// ===== MQTT =====
const broker = "wss://broker.emqx.io:8084/mqtt";
const clientId = "web_smart_home_" + Math.floor(Math.random() * 1000000);
const client = mqtt.connect(broker, {clientId:clientId, clean:true, connectTimeout:8000, reconnectPeriod:5000});

// === 新增：於偵聽主題清單陣列中加入人臉狀態監測主題 ===
const topics = [
  "smarthome/room1/temp",
  "smarthome/room1/humi",
  "smarthome/room1/gas",
  "smarthome/room2/temp",
  "smarthome/room2/humi",
  "smarthome/room2/gas",
  "smarthome/relay/state",
  "smarthome/alarm/gas",
  "smarthome/status",
  "smarthome/stepper/state",
  "smarthome/husky/targetX",
  "smarthome/husky/source",
  "smarthome/face/lock" 
];
const GAS_LIMIT = 1000;
let gas1 = 0;
let gas2 = 0;

function log(msg){
  const el = document.getElementById("log");
  const time = new Date().toLocaleTimeString();
  el.innerHTML = `[${time}] ${msg}<br>` + el.innerHTML;
}

function updateTime(){
  document.getElementById("lastUpdate").textContent = "最後更新：" + new Date().toLocaleTimeString();
}

client.on("connect", () => {
  const status = document.getElementById("mqttStatus");
  status.textContent = "MQTT：已連線 broker.emqx.io";
  status.style.background = "#064e3b";
  topics.forEach(t => client.subscribe(t, {qos:1}));
  log("MQTT 已連線");
});

client.on("reconnect", () => {
  const status = document.getElementById("mqttStatus");
  status.textContent = "MQTT：重新連線中...";
  status.style.background = "#78350f";
  log("MQTT 重新連線");
});

client.on("error", err => {
  const status = document.getElementById("mqttStatus");
  status.textContent = "MQTT：連線錯誤";
  status.style.background = "#7f1d1d";
  log("MQTT 錯誤：" + err.message);
});

client.on("message", (topic, message) => {
  const msg = message.toString();

  if (topic === "smarthome/room1/temp") document.getElementById("r1t").textContent = msg + " °C";
  else if (topic === "smarthome/room1/humi") document.getElementById("r1h").textContent = msg + " %";
  else if (topic === "smarthome/room1/gas") {gas1 = Number(msg);document.getElementById("r1g").textContent = msg;}
  else if (topic === "smarthome/room2/temp") document.getElementById("r2t").textContent = msg + " °C";
  else if (topic === "smarthome/room2/humi") document.getElementById("r2h").textContent = msg + " %";
  else if (topic === "smarthome/room2/gas") {gas2 = Number(msg);document.getElementById("r2g").textContent = msg;}
  else if (topic === "smarthome/relay/state") document.getElementById("relayState").textContent = msg === "1" ? "ON" : "OFF";
  else if (topic === "smarthome/alarm/gas") document.getElementById("gasAlert").classList.toggle("show", msg === "1");
  else if (topic === "smarthome/status") log("ESP 狀態：" + msg);
  else if (topic === "smarthome/stepper/state") document.getElementById("stepperState").textContent = msg;
  else if (topic === "smarthome/husky/targetX") document.getElementById("huskyX").textContent = msg;
  else if (topic === "smarthome/husky/source") document.getElementById("huskySource").textContent = msg;
  
  // === 新增：監聽並即時轉換人臉安全鎖的網頁端狀態 ===
  else if (topic === "smarthome/face/lock") {
    const faceElement = document.getElementById("faceLockStatus");
    if(msg === "1") {
      faceElement.textContent = "人臉鎖安全認證：主辦人已登入成功 🔓";
      faceElement.className = "face-status face-unlocked";
    } else {
      faceElement.textContent = "人臉鎖安全認證：系統鎖定中 🔒 (請在室內機前進行刷臉辨識)";
      faceElement.className = "face-status face-locked";
    }
  }

  updateGasAlert();
  updateTime();
});

function updateGasAlert(){
  const alertBox = document.getElementById("gasAlert");
  if (gas1 >= GAS_LIMIT || gas2 >= GAS_LIMIT) alertBox.classList.add("show");
  else alertBox.classList.remove("show");
}

function loading(btn){
  if (!btn) return;
  btn.classList.add("loading");
  setTimeout(() => btn.classList.remove("loading"), 700);
}

function publish(topic, msg, btn){
  if (!client.connected) {
    alert("MQTT 尚未連線");
    return;
  }
  loading(btn);
  client.publish(topic, msg, {qos:1, retain:false}, err => {
    if (err) log("送出失敗：" + topic + " → " + msg);
    else log("送出：" + topic + " → " + msg);
  });
}

function relayOn(btn){publish("smarthome/relay/cmd", "ON", btn);}
function relayOff(btn){publish("smarthome/relay/cmd", "OFF", btn);}
function irCmd(cmd, btn){publish("smarthome/ir/cmd", cmd, btn);}
function stepperCmd(cmd, btn){publish("smarthome/stepper/cmd", cmd, btn);}
</script>
</body>
</html>
